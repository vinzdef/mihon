name: Fork release
on:
  push:
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: github.repository != 'mihonapp/mihon'
    name: Build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Decode signing keystore
        run: echo "$SIGNING_KEY" | base64 -d > "${{ runner.temp }}/release.keystore"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      # No -Pdist, so the app neither checks Mihon's releases for updates nor includes telemetry
      - name: Build
        run: ./gradlew assembleRelease
        env:
          MIHON_GITHUB_RELEASE: true
          storeFile: ${{ runner.temp }}/release.keystore
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APKs
        run: |
          set -e
          mv app/build/outputs/apk/release/app-universal-release.apk mihon-${{ github.ref_name }}.apk
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk mihon-arm64-v8a-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Mihon ${{ github.ref_name }}
          files: |
            mihon-${{ github.ref_name }}.apk
            mihon-arm64-v8a-${{ github.ref_name }}.apk
